name: RIAN Commander EEMFO3L scoped owner MCP
on:
  push:
    branches: [feature/rian-eemf-owner-command-mcp]
  pull_request:
    paths:
      - 'rian-commander/eemf-operator/**'
      - '.github/workflows/rian-eemf-owner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Compile EEMF owner gateway and scoped relay
        working-directory: rian-commander/eemf-operator
        run: |
          bun build gateway.ts --target=bun --outfile=/tmp/rian-eemf-gateway.js
          bun build relay.ts --target=bun --outfile=/tmp/rian-eemf-relay.js
      - name: Assert distinct credentials and explicit approval gates
        working-directory: rian-commander/eemf-operator
        run: bun test security.test.ts
  powershell-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse EEMF owner opt-in script without changing computer
        shell: powershell
        working-directory: rian-commander/eemf-operator
        run: |
          $content=Get-Content -LiteralPath 'enable-eemf-owner.ps1' -Raw
          $ast=[System.Management.Automation.Language.Parser]::ParseInput($content,[ref]$null,[ref]$errors)
          if($errors.Count -gt 0){throw ('PowerShell parse errors: '+$errors.Count)}
          Write-Output 'PowerShell syntax PASS. No agent configuration touched.'
