name: RIAN Commander D23 restricted runner
on:
  push:
    branches: [feature/rian-commander-d23-restricted-runner]
  pull_request:
    paths:
      - 'rian-commander/d23-runner/**'
      - '.github/workflows/rian-commander-d23-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test fixed D23 Runner policy
        working-directory: rian-commander/d23-runner
        run: python -m unittest discover -v
      - name: Python compile check
        working-directory: rian-commander/d23-runner
        run: python -m py_compile runner.py runner_client.py test_runner.py test_runner_client.py
      - name: Verify PowerShell installer parses without touching system
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rian-commander/d23-runner
        run: |
          foreach ($path in @('install-local.ps1','enroll-local.ps1','run-once.ps1','bootstrap-1q.ps1','enable-poller.ps1')) {
            $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $path))
          }

      - name: Verify actual installer under Windows PowerShell 5.1 (no installation)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: rian-commander/d23-runner
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPUTERNAME = 'DESKTOP-1QGT8D6'
          $output = & .\install-local.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Install preflight returned nonzero' }
          $raw = $output | Out-String
          $result = $raw | ConvertFrom-Json
          if ($result.Mode -ne 'VerifyOnly' -or $result.Tests -ne 'PASS' -or $result.Changes -ne 'None') {
            throw 'PowerShell 5.1 installer verification failed'
          }
          Write-Output 'Windows PowerShell 5.1 dry-run PASS; no installation performed.'
      - name: Verify pinned GitHub bootstrap on Windows PowerShell 5.1 (no installation)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: rian-commander/d23-runner
        run: |
          $ErrorActionPreference = 'Stop'
          $env:COMPUTERNAME = 'DESKTOP-1QGT8D6'
          $output = & .\bootstrap-1q.ps1
          if (-not ($output -match 'Files verified; no installation performed')) {
            throw 'Pinned Bootstrap dry-run did not complete successfully'
          }
          Write-Output 'Windows PowerShell 5.1 pinned bootstrap verification PASS.'


  broker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: D23 broker authorization, durability and signature tests
        working-directory: rian-commander/d23-runner
        run: bun test broker.test.ts
      - name: TypeScript compile and syntax
        working-directory: rian-commander/d23-runner
        run: bun build broker-server.ts --target=bun --outfile=/tmp/rian-d23-broker-check.js
      - name: Build separate operator OAuth MCP gateway
        working-directory: rian-commander/d23-runner
        run: bun build operator-gateway.ts --target=bun --outfile=/tmp/rian-d23-operator-check.js
      - name: Validate D23 operator scope / no automatic approval tool
        working-directory: rian-commander/d23-runner
        run: bun test operator-gateway.test.ts
