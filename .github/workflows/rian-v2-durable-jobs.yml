name: RIAN Commander V2 durable long-running jobs
on:
  push:
    branches: ['feature/rian-commander-v2-**']
  pull_request:
    paths:
      - 'rian-commander/eemf-operator/**'
      - '.github/workflows/rian-v2-durable-jobs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse every staging module
        working-directory: rian-commander/eemf-operator
        run: for f in long-job-kinds.mjs durable-long-jobs.mjs long-job-http.mjs staging-server.mjs staging-entry.mjs staging-sqlite.mjs v2-e2e-server.mjs v2-e2e-gateway.mjs compact-utf8.mjs; do node --check "$f"; done
      - name: Long-job queue, HTTP/MCP/approval and existing tenant suites
        working-directory: rian-commander/eemf-operator
        run: node --test durable-long-jobs.test.mjs long-job-http.test.mjs tenant-artifact-core.test.mjs tenant-artifact-http.test.mjs tenant-job-policy.test.mjs durable-staging.test.mjs outlook-ops-scope.test.mjs staging-crosslang-e2e.test.mjs

  python-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mail index and agent with synthetic data only
        working-directory: rian-commander/eemf-operator
        run: |
          python -m py_compile rian_mail_index.py rian-v2-agent.py tenant-artifact-agent.py
          python rian_mail_index.test.py -v
          python rian-v2-agent.test.py -v
          python tenant-artifact-agent.test.py -v

  process-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real processes - OAuth gateway, staging service and Python agent with crash/restart
        working-directory: rian-commander/eemf-operator
        env:
          PYTHON: python
        run: node --test --test-reporter=spec v2-process-e2e.test.mjs

  macos-installer:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: macOS LaunchAgent secure preparation - no service start or mail access
        working-directory: rian-commander/eemf-operator
        run: |
          python3 -m py_compile install-v2-agent-macos.py
          python3 install-v2-agent-macos.test.py -v
          python3 install-v2-agent-macos.py status

  gateway-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Gateway V2 bridge and existing gateway/relay policy tests
        working-directory: rian-commander/eemf-operator
        run: bun test v2-bridge.test.ts security.test.ts trusted-session.test.ts connection-preflight.test.ts
      - name: Build compact Railway Function payload with lossless UTF-8 compaction
        working-directory: rian-commander/eemf-operator
        run: |
          node compact-css.mjs
          mkdir -p compact
          bun build gateway.deploy.input.ts --target=bun --minify --outfile=compact/rian-owner-compact.js
          node compact-utf8.mjs compact/rian-owner-compact.js | tee /tmp/utf8.json
          echo "::notice::$(cat /tmp/utf8.json)"
      - name: Compact payload stays under the Railway Function limit
        working-directory: rian-commander/eemf-operator
        run: |
          n=$(stat -c %s compact/rian-owner-compact.js)
          echo "::notice::RIAN_COMPACT_BYTES=$n MAX=98295"
          [ "$n" -lt 98295 ] || { echo "::error::compact gateway too large: $n"; exit 1; }
      - name: Compiled compact gateway imports with V2 bridge off and Korean text intact
        working-directory: rian-commander/eemf-operator/compact
        env:
          RIAN_TEST_MODE: "1"
        run: |
          cat > import-check.mjs <<'JS'
          const fail=m=>{console.log("::error::"+m);process.exit(1);};
          let m;try{m=await import("./rian-owner-compact.js");}catch(e){fail("import failed: "+String(e?.message||e).slice(0,300));}
          if(m.v2Ready!==false)fail("v2Ready should be false without config, got "+String(m.v2Ready));
          if(typeof m.v2Rpc!=="function"||typeof m.devTaskParseScope!=="function")fail("compiled exports missing: "+Object.keys(m).join(","));
          const text=m.eemfFailureGuidance("EXECUTABLE_NOT_FOUND");
          if(text!=="실행 파일 및 PATH 확인 필요.")fail("Korean text changed: "+JSON.stringify(text));
          console.log("::notice::COMPACT_UTF8_IMPORT_PASS");
          JS
          bun import-check.mjs

  staging-image:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated staging image
        run: docker build --file rian-commander/eemf-operator/Dockerfile.staging --tag rian-stage-v2 rian-commander/eemf-operator
      - name: Health-only by default; long-job API only with explicit two-tenant config
        shell: bash
        run: |
          set -euo pipefail
          vol="$(mktemp -d)"; chmod 700 "$vol"; key="$(openssl rand -hex 32)"
          cleanup(){ docker rm -f rian-stage-v2 >/dev/null 2>&1 || true; sudo rm -rf -- "$vol"; }
          trap cleanup EXIT
          tok(){ openssl rand -base64 48 | tr '+/' '-_' | tr -d '=\n'; }
          sha(){ printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
          oa="$(tok)"; ob="$(tok)"; aa="$(tok)"; ab="$(tok)"
          principals="[{\"id\":\"oa\",\"tenantId\":\"A\",\"kind\":\"owner\",\"tokenSha256\":\"$(sha "$oa")\"},{\"id\":\"ob\",\"tenantId\":\"B\",\"kind\":\"owner\",\"tokenSha256\":\"$(sha "$ob")\"},{\"id\":\"aa\",\"tenantId\":\"A\",\"kind\":\"agent\",\"deviceId\":\"PC-A\",\"tokenSha256\":\"$(sha "$aa")\"},{\"id\":\"ab\",\"tenantId\":\"B\",\"kind\":\"agent\",\"deviceId\":\"PC-B\",\"tokenSha256\":\"$(sha "$ab")\"}]"
          devices='[{"id":"PC-A","tenantId":"A"},{"id":"PC-B","tenantId":"B"}]'
          approvers='[{"tenantId":"A","ownerId":"oa","salt":"00112233445566778899aabbccddeeff","hash":"'"$(openssl rand -hex 32)"'"},{"tenantId":"B","ownerId":"ob","salt":"ffeeddccbbaa99887766554433221100","hash":"'"$(openssl rand -hex 32)"'"}]'
          docker run -d --name rian-stage-v2 --publish 127.0.0.1:31889:3000 --volume "$vol:/data" \
            --env RIAN_STAGE_ONLY=1 --env RIAN_STAGE_DB_PATH=/data/rian-stage.db --env RIAN_STAGE_STORAGE_KEY="$key" \
            --env RIAN_STAGE_JOBS_ENABLED=1 --env RIAN_STAGE_PUBLIC_URL=https://rian-commander-tenant-staging.example.test \
            --env RIAN_STAGE_FORM_SECRET="$(openssl rand -hex 32)" --env RIAN_STAGE_PRINCIPALS_JSON="$principals" \
            --env RIAN_STAGE_DEVICES_JSON="$devices" --env RIAN_STAGE_APPROVERS_JSON="$approvers" rian-stage-v2 >/dev/null
          for i in $(seq 1 25); do curl -fs http://127.0.0.1:31889/health | grep -q '"jobsEnabled":true' && break; sleep 1; done
          curl -fs http://127.0.0.1:31889/health | grep -q '"jobsEnabled":true'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' http://127.0.0.1:31889/v2/mcp)" = 401 ]
          list="$(curl -fs -X POST -H "authorization: Bearer $oa" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:31889/v2/mcp)"
          echo "$list" | grep -q rian_v2_start_job
          echo "$list" | grep -vq diag.wait
          start="$(curl -fs -X POST -H "authorization: Bearer $oa" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"rian_v2_start_job","arguments":{"device":"PC-A","kind":"mail.sync","params":{"days":14,"maxMessages":1000}}}}' http://127.0.0.1:31889/v2/mcp)"
          echo "$start" | grep -q AWAITING_APPROVAL
          other="$(curl -fs -X POST -H "authorization: Bearer $ob" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"rian_v2_list_jobs","arguments":{}}}' http://127.0.0.1:31889/v2/mcp)"
          echo "$other" | grep -q '\\"jobs\\":\[\]'
          docker restart rian-stage-v2 >/dev/null
          for i in $(seq 1 25); do docker logs rian-stage-v2 2>&1 | grep -q 'RIAN_STAGING_VOLUME_BOOT_SEQUENCE 2' && break; sleep 1; done
          docker logs rian-stage-v2 2>&1 | grep -q 'RIAN_STAGING_LONG_JOBS_RECOVERED'
          sleep 2
          after="$(curl -fs -X POST -H "authorization: Bearer $oa" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"rian_v2_list_jobs","arguments":{}}}' http://127.0.0.1:31889/v2/mcp)"
          echo "$after" | grep -q AWAITING_APPROVAL
          echo 'RIAN_V2_STAGING_IMAGE_PASS'
